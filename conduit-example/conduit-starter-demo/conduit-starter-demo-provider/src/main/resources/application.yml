spring:
  application:
    name: conduit-starter-demo-provider

# 只引入conduit-spring-boot-starter即自动装配（无需@EnableConduit）。
# 用Nacos作为跨进程共享注册中心：provider在此注册，consumer另一个进程从这里发现。
conduit:
  application:
    name: greet-provider
  registry:
    type: nacos
    address: 127.0.0.1:8848        # 需要本地先启动Nacos（见模块README）
  protocol:
    host: 127.0.0.1
    port: 20880                    # 本进程RPC监听端口
    serialization: kryo            # provider/consumer 必须一致
    compress: gzip                 # 两端保持一致：客户端提议，服务端协商接受
    compress-threshold: 1024       # body达到1KB才压缩，小报文不浪费CPU
  transport:
    server:
      reader-idle-timeout-ms: 45000  # 示例值：45s内收不到任何帧则断开失联连接
    # 链路加密（可选）：两端都打开并放入证书；provider需要cert/key，consumer需要trust-cert
    # tls:
    #   enabled: true
    #   cert: classpath:server.crt
    #   key: classpath:server.key
    #   trust-cert: classpath:ca.crt
